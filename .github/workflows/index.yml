name: plate-index
on:
  push:
    branches: [main]
    paths: ["templates/**", "community/**"]

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sh build.sh
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git rm -q --ignore-unmatch plates.txt
          git add plates.bundle
          if ! git diff --cached --quiet; then
            git commit -m "update plates.bundle"
            git push
          fi
