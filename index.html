<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>plate</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside id="side"></aside>
<main>
  <canvas id="cv"></canvas>
  <p id="hint">click a cell to add a photo / drag to move / scroll to zoom</p>
</main>
<section id="ctl">
  <label>gap <input id="gap" type="range" min="0" max="60"></label>
  <label>radius <input id="radius" type="range" min="0" max="120"></label>
  <label>bg <input id="bg" type="color"></label>
  <label>zoom <input id="zoom" type="range" min="1" max="5" step="0.01" value="1"></label>
  <button id="clear">clear photo</button>
  <button id="vsplit">split |</button>
  <button id="hsplit">split &mdash;</button>
  <button id="rm">remove cell</button>
  <button id="save">save .plate</button>
  <button id="open">open .plate</button>
  <button id="export">export png</button>
  <button id="post">post template</button>
  <input id="pick" type="file" accept="image/*" hidden>
  <input id="load" type="file" accept=".plate" hidden>
</section>
<script src="plate.js"></script>
<script src="app.js"></script>
</body>
</html>
